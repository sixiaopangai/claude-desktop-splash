<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小克开机动画</title>
<!--
  小克 / Claude Desktop 开机动画 · 第六版「像素小克变身拟人小克」（约 21 秒）
  五幕：冷启动终端 → 星芒描线炸开 → Clawd 掏书、书页透光、化成像素飞走 → 拟人立绘显影 → 虚化交接
  参考：dsh-cold-boot（真实读数、场景先出后进）、NativeDog1/dsh-boot-animation（显影进场、虚化退场、Esc 与防误触）
  第五版留在 splash_v5.html。无音效。Esc / 空格 / 回车 / 点击画面 都能跳过（开场 0.4 秒内的点击不算）。

  URL 参数：
    ?speed=1.5    整体加速（0.35 – 3）
    ?mcp=N        启动器读本机 Claude 配置后传进来的 MCP 服务器数
    ?embed        嵌入启动器时用：不显示重播按钮
    ?pose=a|b|c|d 指定立绘姿势（默认每次随机，且不和上一次重复）
-->
<style>
  :root {
    --accent: #d97757;
    --fur: #d87656;
    --gold: #f2c27a;
    --cream: #fbf1e2;
    --ink: #1a120d;
    --mono: "Cascadia Mono", "SFMono-Regular", "Consolas", "Menlo", monospace;
    --serif: "Cambria", "Georgia", "Times New Roman", serif;
    --zh: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --zh-serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #000; overflow: hidden; }
  @property --rev { syntax: "<percentage>"; inherits: false; initial-value: -15%; }

  #root {
    position: fixed; inset: 0; overflow: hidden; background: #000;
    color: var(--cream); -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  #root > * { position: absolute; }
  .ch { display: inline-block; opacity: 0; transform: translateY(.16em); transition: opacity 260ms ease, transform 260ms ease; white-space: pre; }
  .in > .ch { opacity: 1; transform: none; }

  /* ── 舞台底色：第三幕暗暖色，第四幕被书照亮 ───────── */
  .bg, .bg4, .rays { inset: 0; opacity: 0; pointer-events: none; }
  .bg {
    background:
      radial-gradient(60% 50% at 50% 62%, rgba(216,118,86,.22) 0%, rgba(216,118,86,0) 70%),
      radial-gradient(140% 100% at 50% 100%, #2a1810 0%, #120b07 55%, #070403 100%);
    transition: opacity 900ms ease;
  }
  .bg4 {
    background:
      radial-gradient(38% 52% at 64% 40%, rgba(255,214,160,.62) 0%, rgba(240,160,100,.26) 45%, rgba(240,160,100,0) 75%),
      radial-gradient(70% 60% at 18% 30%, rgba(255,190,130,.16) 0%, rgba(255,190,130,0) 70%),
      radial-gradient(150% 110% at 60% 100%, #4a2716 0%, #24140c 48%, #0d0705 100%);
    transition: opacity 1400ms ease;
  }
  .bg.in, .bg4.in { opacity: 1; }
  /* 斜着打下来的几道光，像图书馆高窗 */
  .rays {
    inset: -20%;
    background: repeating-conic-gradient(from 196deg at 82% 0%, rgba(255,226,176,0) 0deg, rgba(255,226,176,.11) 2.2deg, rgba(255,226,176,0) 5deg, rgba(255,226,176,0) 9deg);
    -webkit-mask-image: radial-gradient(70% 80% at 70% 20%, #000 0%, transparent 80%);
            mask-image: radial-gradient(70% 80% at 70% 20%, #000 0%, transparent 80%);
    transition: opacity 2200ms ease; mix-blend-mode: screen; will-change: transform;
  }
  .rays.in { opacity: 1; }
  canvas { inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .floor {
    left: 50%; bottom: 3.6vh; width: 46vw; height: 6vh; transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);
    opacity: 0; transition: opacity 900ms ease;
  }

  /* ── 第一幕：冷启动终端 ─────────────────────────── */
  .term {
    left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 40;
    width: min(620px, 86vw); font-family: var(--mono); font-size: 15px; line-height: 2;
    color: #e8dfd2; letter-spacing: .06em;
    text-shadow: 0 0 6px rgba(255,190,140,.35);
  }
  .term .ln { white-space: pre; min-height: 2em; }
  .term .ln b { color: var(--accent); font-weight: 400; }
  .term .ln i { font-style: normal; color: #8f867a; }
  .term .ok { color: #9fd38a; }
  .caret { display: inline-block; width: .6em; height: 1em; background: var(--accent); vertical-align: -.15em; animation: blink 900ms steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .term.jit { animation: jit 360ms steps(4, end) 1; }
  @keyframes jit {
    0% { transform: translate(-50%, -50%); }
    25% { transform: translate(calc(-50% - 4px), -50%) skewX(-4deg); filter: hue-rotate(40deg); }
    50% { transform: translate(calc(-50% + 3px), calc(-50% + 1px)); clip-path: inset(10% 0 40% 0); }
    75% { transform: translate(calc(-50% - 1px), -50%); clip-path: inset(55% 0 5% 0); }
    100% { transform: translate(-50%, -50%); clip-path: none; }
  }
  /* 关显像管一样压成一条线、再缩成一个点 */
  .term.crt { animation: crt 420ms cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes crt {
    0% { transform: translate(-50%, -50%); filter: brightness(1); opacity: 1; }
    55% { transform: translate(-50%, -50%) scale(1, .01); filter: brightness(4); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0, .01); filter: brightness(6); opacity: 0; }
  }
  .dot {
    left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; z-index: 41;
    background: #fff; box-shadow: 0 0 18px 6px rgba(255,200,150,.9); opacity: 0;
  }
  .dot.go { animation: dot 520ms ease-out forwards; }
  @keyframes dot { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(.2); } }

  .scan {
    inset: 0; z-index: 70; pointer-events: none; opacity: .55; transition: opacity 900ms ease;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,0) 1px 3px);
  }
  .scan::after {
    content: ""; position: absolute; left: 0; right: 0; height: 22vh; top: -22vh;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,235,210,.05) 80%, rgba(255,235,210,0));
    animation: roll 2600ms linear infinite;
  }
  @keyframes roll { to { top: 100vh; } }
  .scan.soft { opacity: .14; }

  /* ── 第二幕：星芒一笔描出 → 墨水填满 → 炸开 ─────── */
  .sparkstage {
    left: 50%; top: 50%; transform: translate(-50%, -75px); z-index: 42;
    display: flex; flex-direction: column; align-items: center; pointer-events: none;
  }
  .spark { display: block; overflow: visible; width: 150px; height: 150px; }
  .spark path {
    fill: var(--accent); fill-opacity: 0; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    filter: drop-shadow(0 0 6px rgba(217,119,87,.7));
  }
  .spark.draw path { stroke-dashoffset: 0; transition: stroke-dashoffset 1300ms cubic-bezier(.6,.05,.3,1); }
  .spark.ink path { fill-opacity: 1; transition: fill-opacity 420ms ease, stroke-dashoffset 1300ms; }
  .spark.ink { animation: inkdrop 480ms cubic-bezier(.3,1.6,.5,1); }
  @keyframes inkdrop { from { transform: scale(.88); } to { transform: none; } }
  .spark.burst { animation: burst 380ms cubic-bezier(.5,0,.8,.4) forwards; }
  @keyframes burst { to { transform: scale(1.7) rotate(50deg); opacity: 0; filter: brightness(3); } }
  .sname {
    margin-top: 26px; font-family: var(--serif); font-size: 30px; letter-spacing: .9em; text-indent: .9em;
    opacity: 0; transition: opacity 500ms ease, letter-spacing 1300ms cubic-bezier(.16,.84,.24,1), text-indent 1300ms cubic-bezier(.16,.84,.24,1);
  }
  .sname.in { opacity: 1; letter-spacing: .34em; text-indent: .34em; }
  .sname.out { opacity: 0; transition: opacity 260ms ease; }
  .ssub { margin-top: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .5em; text-indent: .5em; color: rgba(251,241,226,.5); opacity: 0; transition: opacity 500ms ease; }
  .ssub.in { opacity: 1; }
  .ssub.out { opacity: 0; transition: opacity 260ms ease; }

  /* ── 第三幕：Clawd 掏书 ─────────────────────────── */
  .clawd-stage { left: 50%; top: 60%; transform: translate(-50%, -62%); z-index: 30; pointer-events: none; }
  .clawd { display: block; width: min(330px, 40vw); overflow: visible; shape-rendering: crispEdges; opacity: 0; }
  .clawd .fur { fill: var(--fur); }
  .clawd .eye { fill: #000; transform-box: fill-box; transform-origin: center; transition: transform 90ms ease; }
  .clawd.blink .eye { transform: scaleY(.15); }
  .clawd.happy .eye { transform: scale(1.25, .28); transition-duration: 200ms; }
  .clawd .arm { transition: transform 260ms cubic-bezier(.3,1.4,.5,1); }
  .clawd.land { opacity: 1; }
  .clawd.land .c-all { animation: land 620ms cubic-bezier(.3,.9,.4,1) both; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes land {
    0% { transform: translateY(-9px) scale(.94, 1.08); opacity: 0; }
    55% { transform: translateY(0) scale(1.12, .86); opacity: 1; }
    78% { transform: translateY(-.6px) scale(.97, 1.04); }
    100% { transform: none; }
  }
  .clawd.pocket .arm-l { transform: translate(.4px, 1.5px); }
  .clawd.pocket .arm-r { transform: translateY(-1.1px); }
  .clawd.pocket .eye-r { transform: scale(1.35, .3); }
  .clawd.rummage .arm-l { animation: rummage 130ms ease-in-out 4 alternate; }
  @keyframes rummage { from { transform: translate(.4px, 1.5px); } to { transform: translate(.4px, 1.95px); } }
  .tome-held { opacity: 0; transform: scale(.25); transform-box: fill-box; transform-origin: 80% 100%; transition: opacity 120ms ease, transform 320ms cubic-bezier(.3,1.5,.5,1); }
  .clawd.lift .arm-l { transform: translateY(-2.55px); transition-duration: 380ms; }
  .clawd.lift .arm-r { transform: translateY(.6px); }
  .clawd.lift .tome-held { opacity: 1; transform: none; }
  /* 书从手里飘到头顶、摊开 */
  .tome-open { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
  .clawd.open .tome-held { opacity: 0; transition-duration: 80ms; }
  .clawd.open .tome-open { animation: topen 520ms cubic-bezier(.3,1.5,.5,1) forwards, bob 1400ms ease-in-out 520ms infinite; }
  @keyframes topen { 0% { opacity: 0; transform: translate(-4px, 2px) scale(.3, .6); } 100% { opacity: 1; transform: none; } }
  @keyframes bob { 50% { transform: translateY(-.35px); } }
  .clawd.open .arm-l, .clawd.open .arm-r { transform: translateY(-1.7px); }
  .tome-glow { opacity: 0; transition: opacity 500ms ease; }
  .clawd.open .tome-glow { opacity: 1; }
  .beam { opacity: 0; transition: opacity 600ms ease; mix-blend-mode: screen; }
  .clawd.beaming .beam { opacity: 1; animation: flicker 180ms steps(2, end) 3; }
  @keyframes flicker { 50% { opacity: .55; } }
  .clawd .body-g { transition: filter 600ms ease; }
  .clawd.glow .body-g { filter: brightness(1.35) drop-shadow(0 0 .8px #ffc070); }
  .clawd.hop .c-all { animation: hop 420ms cubic-bezier(.3,.7,.4,1) 2; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes hop { 0%, 100% { transform: none; } 40% { transform: translateY(-1.2px); } }
  .clawd.gone { opacity: 0; transition: opacity 160ms ease; }

  /* ── 第四幕：拟人立绘 ───────────────────────────── */
  .girl-wrap {
    left: 64%; bottom: 3vh; z-index: 20; pointer-events: none;
    height: min(90vh, 1521px); aspect-ratio: var(--girl-ar, 917 / 1517);
    transform: translateX(-50%); will-change: transform;
  }
  .dev, .breath { position: absolute; inset: 0; }
  .dev {
    opacity: 0;
    -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(var(--rev) - 10%), transparent calc(var(--rev) + 6%));
            mask-image: linear-gradient(180deg, #000 0, #000 calc(var(--rev) - 10%), transparent calc(var(--rev) + 6%));
    filter: blur(14px) brightness(1.9) saturate(.5); transform: scale(1.04);
  }
  .dev.in {
    opacity: 1; --rev: 118%; filter: blur(0) brightness(1) saturate(1); transform: none;
    transition: --rev 1500ms cubic-bezier(.5,0,.25,1), filter 1800ms ease, transform 2200ms cubic-bezier(.16,.84,.24,1), opacity 240ms ease;
  }
  /* 显影完把遮罩和滤镜都摘掉：父层留着 filter 会把立绘的边缘光裁成一个矩形框 */
  .dev.done { -webkit-mask-image: none; mask-image: none; filter: none; }
  /* 放了 assets/act4.mp4 就用视频顶替第四幕的静态立绘（画面整幅铺满，文案和花瓣照样叠在上面） */
  .vid-dev { z-index: 19; display: none; }
  .has-vid .vid-dev { display: block; }
  .has-vid .girl-wrap { visibility: hidden; }
  .vid { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* ?keyframe：只留第四幕的背景和立绘，导出给视频模型当首帧 */
  .keyframe .copy, .keyframe .hud, .keyframe .progress, .keyframe .scan, .keyframe .grain,
  .keyframe canvas, .keyframe .term, .keyframe .sparkstage, .keyframe .clawd-stage { display: none; }
  .keyframe .dev { transition: none; }
  .breath { transform-origin: 50% 100%; animation: breath 3600ms ease-in-out infinite; }
  @keyframes breath { 50% { transform: scale(1.004, 1.009); } }
  .girl { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 26px rgba(255,170,96,.32)); }
  /* 用立绘自己的轮廓做遮罩：扫描光、掠光都只落在她身上 */
  .onfig { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  .revglow { background: linear-gradient(180deg, rgba(255,220,160,0) 0%, rgba(255,220,160,0) 46%, rgba(255,232,190,.95) 50%, rgba(255,220,160,0) 54%, rgba(255,220,160,0) 100%);
    background-size: 100% 300%; background-position: 0 82.5%; opacity: 0; }
  .revglow.go { animation: revglow 1500ms cubic-bezier(.5,0,.25,1) forwards; }
  @keyframes revglow { 0% { opacity: 1; background-position: 0 82.5%; } 85% { opacity: 1; } 100% { opacity: 0; background-position: 0 16%; } }
  .sheen { background: linear-gradient(105deg, rgba(255,240,210,0) 40%, rgba(255,244,222,.5) 50%, rgba(255,240,210,0) 60%);
    background-size: 300% 100%; background-position: 100% 0; opacity: 0; }
  .sheen.go { animation: sheen 1700ms cubic-bezier(.45,0,.3,1) forwards; }
  @keyframes sheen { 0% { opacity: 1; background-position: 100% 0; } 100% { opacity: 1; background-position: 0% 0; } }
  .bookglow {
    position: absolute; width: 34%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,226,170,.75) 0%, rgba(255,190,110,.28) 38%, rgba(255,190,110,0) 70%);
    mix-blend-mode: screen; opacity: 0; transition: opacity 900ms ease;
  }
  .bookglow.in { opacity: 1; animation: pulse 2200ms ease-in-out infinite; }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.15); opacity: .7; } }
  /* 四角小闪光：落在发饰、胸针、书、裙摆的星芒花上 */
  .glint { position: absolute; width: 7%; aspect-ratio: 1; transform: translate(-50%, -50%) scale(0); opacity: 0; }
  .glint::before, .glint::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(closest-side, #fff 0%, rgba(255,230,180,.9) 18%, rgba(255,230,180,0) 100%); }
  .glint::before { clip-path: polygon(50% 0, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0 50%, 44% 44%); }
  .glint::after { inset: 32%; border-radius: 50%; }
  .glints.in .glint { animation: glint 2600ms ease-in-out infinite; }
  @keyframes glint {
    0%, 100% { transform: translate(-50%, -50%) scale(0) rotate(0); opacity: 0; }
    12% { transform: translate(-50%, -50%) scale(1) rotate(45deg); opacity: 1; }
    26% { transform: translate(-50%, -50%) scale(0) rotate(90deg); opacity: 0; }
  }
  .gfloor {
    position: absolute; left: 50%; bottom: -1.6%; width: 78%; height: 5%; transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.6), rgba(0,0,0,0) 70%);
  }
  .gbloom {
    z-index: 34; width: 90vmax; height: 90vmax; margin: -45vmax 0 0 -45vmax; border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255,250,236,1) 0%, rgba(255,232,190,.85) 16%, rgba(255,196,130,.4) 38%, rgba(255,196,130,0) 66%);
  }
  .gbloom.go { animation: gbloom 1500ms cubic-bezier(.22,.68,.2,1) forwards; }
  @keyframes gbloom { 0% { opacity: 0; transform: scale(.02); } 24% { opacity: 1; transform: scale(.4); } 55% { opacity: .9; } 100% { opacity: 0; transform: scale(1.5); } }

  /* 左侧文案 */
  .copy { left: 8vw; top: 50%; transform: translateY(-56%); z-index: 36; width: min(46vw, 640px); pointer-events: none; will-change: transform; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .42em; color: var(--gold); opacity: 0; transform: translateX(-16px); transition: opacity 600ms ease, transform 600ms cubic-bezier(.16,.84,.24,1); }
  .eyebrow.in { opacity: .9; transform: none; }
  .title { margin-top: 14px; font-family: var(--serif); font-style: italic; font-size: clamp(64px, 8.4vw, 132px); line-height: 1; letter-spacing: .01em;
    color: #fff4e4; text-shadow: 0 0 28px rgba(255,180,110,.45), 0 2px 0 rgba(0,0,0,.18); }
  .title .lt { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(.18em); transition: opacity 700ms ease, filter 800ms ease, transform 800ms cubic-bezier(.16,.84,.24,1); }
  .title.in .lt { opacity: 1; filter: blur(0); transform: none; }
  .zhname { margin-top: 18px; display: flex; align-items: center; gap: 16px; opacity: 0; transition: opacity 600ms ease; }
  .zhname.in { opacity: 1; }
  .zhname b { font-family: var(--zh-serif); font-size: 30px; font-weight: 700; letter-spacing: .3em; color: var(--cream); }
  .zhname i { display: block; height: 1px; width: 0; background: linear-gradient(90deg, var(--gold), rgba(242,194,122,0)); transition: width 900ms cubic-bezier(.2,.9,.2,1) 150ms; }
  .zhname.in i { width: 180px; }
  .zhname span { font-family: var(--mono); font-size: 10px; letter-spacing: .36em; color: rgba(251,241,226,.55); }
  .tag { margin-top: 30px; font-family: var(--serif); font-style: italic; font-size: clamp(18px, 1.6vw, 24px); color: #fbe9d2; letter-spacing: .02em; min-height: 1.4em; }
  .tagzh { margin-top: 8px; font-family: var(--zh-serif); font-size: 16px; letter-spacing: .3em; color: rgba(251,233,210,.75); min-height: 1.5em; }
  .say { margin-top: 30px; font-family: var(--zh); font-size: 16px; letter-spacing: .1em; color: var(--cream);
    padding-left: 14px; border-left: 2px solid var(--accent); opacity: 0; transform: translateY(10px); transition: opacity 500ms ease, transform 500ms cubic-bezier(.16,.84,.24,1); }
  .say.in { opacity: .95; transform: none; }
  .copy.out { opacity: 0; filter: blur(6px); transition: opacity 600ms ease, filter 600ms ease; }

  /* ── HUD：四角、底部读数、跳过、进度 ───────────── */
  .hud { inset: 0; z-index: 60; pointer-events: none; opacity: 0; transition: opacity 700ms ease; }
  .hud.in { opacity: 1; }
  .corner { position: absolute; width: 16px; height: 16px; }
  .corner::before, .corner::after { content: ""; position: absolute; background: rgba(251,241,226,.3); }
  .corner::before { width: 100%; height: 1px; } .corner::after { width: 1px; height: 100%; }
  .c-tl { left: 26px; top: 26px; } .c-tl::before, .c-tl::after { top: 0; left: 0; }
  .c-tr { right: 26px; top: 26px; } .c-tr::before, .c-tr::after { top: 0; right: 0; }
  .c-bl { left: 26px; bottom: 26px; } .c-bl::before, .c-bl::after { bottom: 0; left: 0; }
  .c-br { right: 26px; bottom: 26px; } .c-br::before, .c-br::after { bottom: 0; right: 0; }
  .readout { position: absolute; left: 46px; bottom: 40px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .24em; color: rgba(251,241,226,.6); }
  .readout b { color: var(--gold); font-weight: 400; }
  .powered { position: absolute; right: 46px; bottom: 40px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .24em; color: rgba(251,241,226,.5); display: flex; gap: 10px; align-items: center; }
  .powered i { display: block; width: 26px; height: 7px; background: var(--accent); }
  .skip {
    position: absolute; right: 40px; top: 36px; pointer-events: auto; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: .24em; color: rgba(251,241,226,.55);
    background: none; border: 1px solid transparent; padding: 5px 10px;
  }
  .skip:hover { color: #fff; border-color: rgba(251,241,226,.3); }
  .progress { left: 50%; bottom: 12px; z-index: 61; width: min(420px, 32vw); height: 2px; transform: translateX(-50%); background: rgba(251,241,226,.1); }

    }
    const r = $(".girl-wrap").getBoundingClientRect();
    return [r.left + r.width * SPOTS.book[0] / 100, r.top + r.height * SPOTS.book[1] / 100];
  }

  function playVideo() {
    const v = $(".vid");
    if (!root.classList.contains("has-vid")) return;
    v.currentTime = 0;
    v.play().catch(() => {});
  }

  function clawd(add, remove = []) {
    const c = $(".clawd");
    c.classList.remove(...remove);
    c.classList.add(...add);
  }

  function blink() {
    const c = $(".clawd");
    c.classList.add("blink");
    setTimeout(() => c.classList.remove("blink"), 130);
  }

  function setFlash(op, ms) {
    const f = $(".flash");
    f.style.transition = `opacity ${ms}ms ease`;
    f.style.opacity = op;
  }

  function finish() {
    if (finished) return;
    finished = true;
    timers.forEach(clearTimeout);
    intervals.forEach(clearInterval);
    timers = []; intervals = [];
    root.classList.add("handoff");
    // 给外层启动器的信号：它轮询窗口标题，看到 HANDOFF 开始淡出窗口，看到 DONE 关窗
    document.title = "小克开机动画 · HANDOFF";
    setTimeout(() => {
      cancelAnimationFrame(raf);
      document.title = "小克开机动画 · DONE";
      document.dispatchEvent(new CustomEvent("splash:done"));
      try { window.chrome?.webview?.postMessage("splash:done"); } catch (e) {}
      if (!EMBED) replayBtn.classList.add("show");
    }, 800);
  }

  // 第四幕直接摆好的样子：减少动态效果时用，只停留一小会儿
  function showStill() {
    ["bg4", "rays", "hud", "eyebrow", "title", "zhname", "say"].forEach(c => on("." + c));
    onAll(".dev"); onAll(".dev", "done"); on(".scan", "soft");
    $(".term").style.display = "none"; $(".sparkstage").style.display = "none";
    $(".tag").textContent = "Knowledge illuminates a brighter tomorrow.";
    $(".tagzh").textContent = "知识，照亮更好的明天。";
    at(2600, finish);
  }

  function play() {
    timers.forEach(clearTimeout);
    intervals.forEach(clearInterval);
    cancelAnimationFrame(raf);
    timers = []; intervals = []; finished = false;
    replayBtn.classList.remove("show");
    document.title = "小克开机动画";

    root.className = "";
    root.innerHTML = TEMPLATE;
    reflow(root);
    startedAt = performance.now();
    // 扫描光、掠光用立绘轮廓做遮罩；file:// 下只有 data URL 能当遮罩，没加载到就不显示这两层
    root.style.setProperty("--girl-ar", `${GW} / ${GH}`);
    $(".girl").src = girlSrc();
    root.querySelectorAll(".onfig").forEach(el => {
      if (window.CLAUDE_GIRL) el.style.webkitMaskImage = el.style.maskImage = `url("${girlSrc()}")`;
      else el.style.display = "none";
    });
    $(".skip").addEventListener("click", e => { e.stopPropagation(); finish(); });

    const R = readings();
    $(".readout").innerHTML = `SESSION READY · <b>${R.time}</b>` + (R.mcp ? ` · MCP ${MCP}` : "");

    // 视频能读出第一帧才切到视频模式；文件不存在就安静地用静态立绘
    const v = $(".vid");
    v.addEventListener("loadeddata", () => root.classList.add("has-vid"), { once: true });
    v.src = VIDEO;

    if (KEYFRAME) {
      root.classList.add("keyframe");
      on(".bg4"); on(".rays"); onAll(".dev"); onAll(".dev", "done");
      return;
    }
    if (REDUCED) { showStill(); return; }

    fxInit();
    raf = requestAnimationFrame(fxLoop);
    const TOTAL = 20600;
    const bar = $(".progress i");
    bar.style.transition = `width ${TOTAL / SPEED}ms linear`;
    reflow(bar); bar.style.width = "100%";

    // ── 第一幕 0 – 3.3s：冷启动终端，读数都是真的 ──
    const term = $(".term");
    const LINES = [
      `<b>›</b> CLAUDE DESKTOP <i>·</i> COLD BOOT`,
      `<b>›</b> HOST   ${R.host}`,
      `<b>›</b> TIME   ${R.date} ${R.time}`,
      `<b>›</b> ${R.mcp ? "MCP    " + R.mcp : "TOOLS  READY"}`,
      `<b>›</b> MEMORY <i>.............</i> <span class="ok">OK</span>`,
      `<b>›</b> 唤醒小克 <i>...........</i> `,
    ];
    term.innerHTML = LINES.map(() => `<div class="ln"></div>`).join("");
    const lns = term.querySelectorAll(".ln");
    LINES.forEach((html, i) => at(150 + i * 380, () => {
      // 带标签的行整行写入，再逐字显出来：把文字节点拆成 .ch
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      let k = 0;
      const wrap = node => {
        if (node.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const c of node.textContent) {
            const s = document.createElement("span");
            s.className = "ch"; s.textContent = c;
            s.style.transitionDelay = `${Math.round(k++ * 9 / SPEED)}ms`;
            frag.appendChild(s);
          }
          node.replaceWith(frag);
        } else [...node.childNodes].forEach(wrap);
      };
      [...tmp.childNodes].forEach(wrap);
      lns[i].innerHTML = "";
      lns[i].append(...tmp.childNodes);
      reflow(lns[i]);
      // .in 只作用在直接子元素上，嵌套的 <b>/<i> 里也要亮
      lns[i].classList.add("in");
      lns[i].querySelectorAll("b, i, span:not(.ch)").forEach(el => el.classList.add("in"));
      if (i === LINES.length - 1) lns[i].insertAdjacentHTML("beforeend", `<span class="caret"></span>`);
    }));
    at(2650, () => on(".term", "jit"));
    at(2950, () => { term.classList.remove("jit"); reflow(term); on(".term", "crt"); });
    at(3250, () => on(".dot", "go"));

    // ── 第二幕 3.4 – 6.2s：星芒一笔描出 → 填满 → 炸成花瓣 ──
    at(3400, () => { on(".spark", "draw"); on(".sname"); });
    at(4000, () => on(".ssub"));
    at(4800, () => on(".spark", "ink"));
    at(5900, () => {
      on(".spark", "burst"); on(".sname", "out"); on(".ssub", "out");
      burstSpark(innerWidth / 2, innerHeight / 2 - 30);
      setFlash(.35, 90);
    });
    at(6030, () => setFlash(0, 800));

    // ── 第三幕 6.2 – 12.6s：Clawd 落地、掏书、书页透光、化成像素飞走 ──
    at(6250, () => { on(".bg"); on(".floor"); on(".hud"); on(".scan", "soft"); $(".term").style.display = "none"; });
    at(6600, () => clawd(["land"]));
    at(7350, blink);
    at(7750, blink);
    at(8100, () => clawd(["pocket", "rummage"]));
    at(8800, () => clawd(["lift"], ["pocket", "rummage"]));
    at(9700, () => clawd(["open", "happy"], ["lift"]));
    at(10200, () => clawd(["beaming", "glow"]));
    at(10700, () => clawd(["hop"]));
    at(11400, () => {
      const [bx, by] = bookPoint();
      dissolveClawd(bx, by);
      clawd(["gone"]);
      off(".floor");
    });

    // ── 第四幕 12.9 – 19.3s：像素汇进书里 → 光炸开 → 立绘显影 ──
    at(12900, () => {
      const [bx, by] = bookPoint();
      const g = $(".gbloom");
      g.style.left = bx + "px"; g.style.top = by + "px";
      g.classList.add("go");
      on(".bg4"); on(".rays");
      setFlash(.5, 260);
    });
    at(13150, () => {
      setFlash(0, 1000);
      playVideo();
      fx.act4 = performance.now();
      seedAmbient();
      onAll(".dev"); on(".revglow", "go");
      $(".bg").classList.remove("in");
    });
    at(15400, () => onAll(".dev", "done"));
    at(14000, () => { on(".bookglow"); on(".glints"); on(".eyebrow"); });
    at(14300, () => on(".title"));
    at(14950, () => on(".zhname"));
    at(15300, () => on(".sheen", "go"));
    at(15700, () => typeInto($(".tag"), "Knowledge illuminates a brighter tomorrow.", 34));
    at(17100, () => typeInto($(".tagzh"), "知识，照亮更好的明天。", 80));
    at(18000, () => on(".say"));

    // ── 第五幕 19.3 – 21.4s：文案虚化、立绘再掠一道光，交接给 Claude ──
    at(19300, () => { const s = $(".sheen"); s.classList.remove("go"); reflow(s); s.classList.add("go"); });
    at(19900, () => on(".copy", "out"));
    at(TOTAL, finish);
  }

  // 重播就整页重新载入，顺便换一种姿势
  const replay = () => location.reload();
  replayBtn.addEventListener("click", replay);
  // 点画面任意处跳过；刚开场 0.4 秒内的点击不算，防止双击快捷方式的第二下把它跳掉
  root.addEventListener("click", () => { if (performance.now() - startedAt > 400) finish(); });
  document.addEventListener("keydown", e => {
    if (["Escape", " ", "Enter"].includes(e.key)) finish();
    else if ((e.key === "r" || e.key === "R") && finished && !EMBED) replay();
  });
  addEventListener("resize", fxResize);

  // 只加载这次抽中的那一张立绘（每张一两 MB，没必要四张全读）；加载失败也照常播，退回直接引用 webp
  const tag = document.createElement("script");
  tag.src = `assets/girl-${POSE}.js`;
  tag.onload = tag.onerror = play;
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
